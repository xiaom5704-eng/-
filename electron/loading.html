<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>正在啟動智慧醫療助理</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #334155; font: 18px/1.8 system-ui, sans-serif; }
    main { max-width: 32em; margin: 2rem; text-align: center; }
    h1 { font-size: 1.5rem; color: #047857; }
    p { margin: .6rem 0; }
    .spinner { width: 2.5rem; height: 2.5rem; margin: auto; border: 4px solid #d1fae5; border-top-color: #059669; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body><main role="status"><div class="spinner" aria-hidden="true"></div><h1>正在準備本機藥品資料</h1><p>第一次開啟會安裝藥品資料、參考圖片與辨識模型，需要一些時間。</p><p>完成後會自動進入查詢介面，之後開啟會更快。</p></main></body>
</html>
